name: Maven Verify

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: maven-verify-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  inspect_push_branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_open_pr: ${{ steps.find_pr.outputs.has_open_pr }}
      pr_title: ${{ steps.metadata.outputs.pr_title }}
      pr_body: ${{ steps.metadata.outputs.pr_body }}
    steps:
      - name: Checkout branch head
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate branch naming and commit trailers
        if: github.event_name == 'push'
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          branch_name="${GITHUB_REF_NAME}"

          if [[ ! "${branch_name}" =~ ^(feat|fix)/(.+)$ ]]; then
            echo "Branch '${branch_name}' must follow feat/<descricao> or fix/<descricao>."
            exit 1
          fi

          change_type="${BASH_REMATCH[1]}"
          raw_description="${BASH_REMATCH[2]}"

          if [[ "${raw_description}" == *"/"* ]]; then
            echo "Branch description must be a single segment after feat/ or fix/."
            exit 1
          fi

          normalized_description="$(printf '%s' "${raw_description}" \
            | tr '_-' '  ' \
            | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"

          if [[ -z "${normalized_description}" ]]; then
            echo "Branch description cannot be empty after normalization."
            exit 1
          fi

          if [[ "${#normalized_description}" -gt 72 ]]; then
            echo "Branch description must stay concise and have at most 72 characters after normalization."
            exit 1
          fi

          commit_message="$(git log -1 --pretty=%B "${GITHUB_SHA}")"

          objetivo_line="$(printf '%s\n' "${commit_message}" | awk '/^Objetivo:[[:space:]]*/ { sub(/^Objetivo:[[:space:]]*/, ""); print; exit }')"
          como_line="$(printf '%s\n' "${commit_message}" | awk '/^Como:[[:space:]]*/ { sub(/^Como:[[:space:]]*/, ""); print; exit }')"

          objetivo="$(printf '%s' "${objetivo_line}" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          como="$(printf '%s' "${como_line}" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"

          if [[ -z "${objetivo}" || -z "${como}" ]]; then
            echo "The head commit must include non-empty trailers in this format:"
            echo "Objetivo: <descricao em alto nivel>"
            echo "Como: <descricao da implementacao>"
            exit 1
          fi

          pr_title="${change_type}/${normalized_description}"

          {
            echo "pr_title=${pr_title}"
            echo "pr_body<<EOF"
            printf '1. Objetivo: %s\n2. Como: %s\n' "${objetivo}" "${como}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Detect existing open pull request
        if: github.event_name == 'push'
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          existing_pr_number="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls" \
              --method GET \
              -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
              -f base=master \
              -f per_page=1 \
              --jq '.[0].number // empty'
          )"

          if [[ -n "${existing_pr_number}" ]]; then
            echo "has_open_pr=true" >> "${GITHUB_OUTPUT}"
            echo "Open PR #${existing_pr_number} already exists for ${GITHUB_REF_NAME}; skipping automatic creation."
          else
            echo "has_open_pr=false" >> "${GITHUB_OUTPUT}"
          fi

  maven_verify:
    name: Maven Verify
    runs-on: ubuntu-latest
    needs:
      - inspect_push_branch
    permissions:
      contents: read
      pull-requests: write
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        needs.inspect_push_branch.result == 'success' &&
        needs.inspect_push_branch.outputs.has_open_pr != 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verify
        shell: bash
        run: mvn --batch-mode verify

      - name: Summarize PMD and CPD for the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          event_path = pathlib.Path(os.environ["GITHUB_EVENT_PATH"])
          event = json.loads(event_path.read_text(encoding="utf-8"))
          pr_number = event["pull_request"]["number"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          server_url = os.environ["GITHUB_SERVER_URL"]
          run_id = os.environ["GITHUB_RUN_ID"]
          sha = os.environ["GITHUB_SHA"]

          marker = "<!-- codex-pmd-cpd-summary -->"
          pmd_path = pathlib.Path("target/pmd.xml")
          cpd_path = pathlib.Path("target/cpd.xml")

          def summarize_pmd(path: pathlib.Path) -> list[str]:
            if not path.exists():
              return []
            root = ET.parse(path).getroot()
            violations = []
            for file_node in root.findall("file"):
              file_name = file_node.get("name", "")
              rel_name = file_name.split("/MEI-ORGANIZADIN/")[-1]
              for violation in file_node.findall("violation"):
                beginline = violation.get("beginline", "?")
                rule = violation.get("rule", "unknown-rule")
                text = " ".join((violation.text or "").split())
                violations.append(f"- `{rule}` — `{rel_name}:{beginline}`\n  - {text}")
            return violations

          def summarize_cpd(path: pathlib.Path) -> list[str]:
            if not path.exists():
              return []
            root = ET.parse(path).getroot()
            duplications = []
            for duplication in root.findall("duplication"):
              lines = duplication.get("lines", "?")
              files = []
              for file_node in duplication.findall("file"):
                file_name = file_node.get("path", "")
                rel_name = file_name.split("/MEI-ORGANIZADIN/")[-1]
                line = file_node.get("line", "?")
                files.append(f"  - `{rel_name}:{line}`")
              duplication_summary = [f"- Duplicação de {lines} linhas", *files]
              duplications.append("\n".join(duplication_summary))
            return duplications

          pmd_items = summarize_pmd(pmd_path)
          cpd_items = summarize_cpd(cpd_path)

          body_lines = [
            marker,
            "## Resumo de qualidade do código",
            "",
            f"Commit analisado: `{sha[:7]}`",
            f"[Ver run completo]({server_url}/{repo}/actions/runs/{run_id})",
            ""
          ]

          if pmd_items:
            body_lines.extend(["### PMD", *pmd_items[:20], ""])
            if len(pmd_items) > 20:
              body_lines.append(f"_Mais {len(pmd_items) - 20} violações de PMD não listadas neste resumo._")
              body_lines.append("")

          if cpd_items:
            body_lines.extend(["### CPD", *cpd_items[:20], ""])
            if len(cpd_items) > 20:
              body_lines.append(f"_Mais {len(cpd_items) - 20} duplicações de CPD não listadas neste resumo._")
              body_lines.append("")

          if not pmd_items and not cpd_items:
            body_lines.extend([
              "Nenhuma violação de PMD ou CPD foi encontrada nesta revisão.",
              ""
            ])

          body = "\n".join(body_lines).rstrip() + "\n"

          api_base = f"https://api.github.com/repos/{repo}"
          headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "codex-quality-summary"
          }

          def request_json(method: str, url: str, payload: dict | None = None):
            data = None if payload is None else json.dumps(payload).encode("utf-8")
            req = urllib.request.Request(url, data=data, method=method, headers=headers)
            with urllib.request.urlopen(req) as response:
              return json.loads(response.read().decode("utf-8"))

          comments_url = f"{api_base}/issues/{pr_number}/comments?per_page=100"
          comments = request_json("GET", comments_url)
          existing = next((comment for comment in comments if marker in comment.get("body", "")), None)

          if existing:
            request_json("PATCH", f"{api_base}/issues/comments/{existing['id']}", {"body": body})
          else:
            request_json("POST", f"{api_base}/issues/{pr_number}/comments", {"body": body})
          PY

  open_pull_request:
    if: |
      github.event_name == 'push' &&
      needs.inspect_push_branch.result == 'success' &&
      needs.inspect_push_branch.outputs.has_open_pr != 'true' &&
      needs.maven_verify.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - inspect_push_branch
      - maven_verify
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create pull request to master
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ needs.inspect_push_branch.outputs.pr_title }}
          PR_BODY: ${{ needs.inspect_push_branch.outputs.pr_body }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base master \
            --head "${GITHUB_REF_NAME}" \
            --title "${PR_TITLE}" \
            --body "${PR_BODY}"
